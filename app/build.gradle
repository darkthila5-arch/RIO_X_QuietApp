plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.quietapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.quietapp"
        minSdk 21          // Android 5.0 සිට ඉහළ සියල්ලට
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.work:work-runtime:2.9.0'
}
