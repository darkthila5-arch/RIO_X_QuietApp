plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.quietapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.quietapp"
        minSdk 21          // Android 5.0 සිට ඉහළ සියල්ලට
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
